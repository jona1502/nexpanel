name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.96.1
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --locked

  website:
    name: Website (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - name: Verify runtime versions
        run: |
          node --version
          npm --version
          node -e "const p = require('./package.json'); if (process.versions.node !== p.engines.node) process.exit(1)"
          test "$(npm --version)" = "11.19.1"
      - name: Install dependencies
        run: npm ci
      - name: Check website
        run: npm run check
      - name: Build website
        run: npm run build
